<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eupry Keyword Portal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css?v=4">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7.71429 12C7.71429 14.6036 5.60363 16.7143 3 16.7143L3 21C7.96584 21 11.9923 16.9782 12 12.0141C12.0076 16.9782 16.0341 21 21 21L21 16.7143C18.3963 16.7143 16.2857 14.6036 16.2857 12L7.71429 12Z' fill='%23070A26'/%3E%3Cpath d='M16.7143 12C16.7143 9.39639 14.6036 7.28573 12 7.28573C9.39638 7.28574 7.28573 9.39636 7.28573 12L3.00002 12C3.00002 7.02943 7.02946 3 12 3C16.9706 3.00001 21 7.02946 21 12H16.7143Z' fill='%23070A26'/%3E%3C/svg%3E">
</head>
<body>
    {% if user %}
    <header>
        <a href="/" class="logo" aria-label="Eupry Keyword Portal home">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7.71429 12C7.71429 14.6036 5.60363 16.7143 3 16.7143L3 21C7.96584 21 11.9923 16.9782 12 12.0141C12.0076 16.9782 16.0341 21 21 21L21 16.7143C18.3963 16.7143 16.2857 14.6036 16.2857 12L7.71429 12Z" fill="#070A26"/>
                <path d="M16.7143 12C16.7143 9.39639 14.6036 7.28573 12 7.28573C9.39638 7.28574 7.28573 9.39636 7.28573 12L3.00002 12C3.00002 7.02943 7.02946 3 12 3C16.9706 3.00001 21 7.02946 21 12H16.7143Z" fill="#070A26"/>
            </svg>
            <span class="logo-text">eupry</span>
            <span class="logo-suffix">keyword portal</span>
        </a>
        <nav>
            <span class="user">{{ user.email }}</span>
            <a href="/auth/logout" class="icon-link" title="Sign out">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M10.5007 5H16.5007C17.6053 5 18.5007 5.89543 18.5007 7V18C18.5007 19.1046 17.6053 20 16.5007 20H10.5007" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M15 12.4998H5M5 12.4998L9 8.5M5 12.4998L9 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </a>
        </nav>
    </header>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
